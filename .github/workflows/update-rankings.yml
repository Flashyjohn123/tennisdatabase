name: Sync Official Tennis Rankings

on:
  schedule:
    # Run every Monday at 06:00 UTC when official weekly rankings are released
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  update-rankings:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Run Rankings Sync
        run: bun run sync:rankings

      - name: Check for Changes
        id: git-check
        run: |
          git diff --exit-code || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Commit and Push Updated Rankings
        if: steps.git-check.outputs.changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/
          git commit -m "chore(data): auto-sync official ATP & WTA rankings [skip ci]"
          git push
